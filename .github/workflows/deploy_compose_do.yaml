name: Deploy Docker Compose to DO

on:
  workflow_run:
    workflows: ["Build Docker Image"]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Debug files
        run: ls -lah

      - name: create .env 
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_SSLMODE: ${{ secrets.POSTGRES_SSLMODE }}
          SHINY_USER: ${{ secrets.SHINY_USER }}
          SHINY_PASSWORD: ${{ secrets.SHINY_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # Write .env file with GH secrets
          cat <<EOT > .env
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_HOST=${POSTGRES_HOST}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
          SHINY_USER=${SHINY_USER}
          SHINY_PASSWORD=${SHINY_PASSWORD}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          RESEND_API_KEY=${RESEND_API_KEY}

          EOT

      - name: Deploy with Docker Compose     
        env:
         SERVER_HOST: ${{ secrets.SERVER_HOST }}
         SERVER_USER: ${{ secrets.SERVER_USER }}
         GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |      
          # Copy nginx.conf to the server
          scp -i ~/.ssh/deploy_key ./nginx.conf ${SERVER_USER}@${SERVER_HOST}:/opt/glatar/nginx.conf
          scp -i ~/.ssh/deploy_key ./temp-nginx.conf ${SERVER_USER}@${SERVER_HOST}:/opt/glatar/temp-nginx.conf

          # copy docker-compose.yaml 
          scp -i ~/.ssh/deploy_key ./docker-compose.yaml ${SERVER_USER}@${SERVER_HOST}:/opt/glatar/docker-compose.yaml
          # copy .env 
          scp -i ~/.ssh/deploy_key .env ${SERVER_USER}@${SERVER_HOST}:/opt/glatar/.env
          
          # login into the server 
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} << EOF

          set -e
          # go into the folder 
        
          cd /opt/glatar

          # Optional: secure permissions
          chmod 600 .env
          
          # ---- shared docker container ----

          docker network create edge-net || true

          # Login to GHCR
          
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u benjaminhlina --password-stdin
          

          # docker compose everything together 
          docker compose pull

          # 4. Check if SSL certificates already exist
          CERT_DIR="./certbot/conf/live/glatar.org"
          
          if [ ! -d "\$CERT_DIR" ]; then
            echo "SSL Certificate not found. Using temp-nginx.conf for ACME bootstrap..."

            # Backup main nginx.conf and replace with temp-nginx.conf
            cp nginx.conf nginx.conf.bak
            cp temp-nginx.conf nginx.conf

            # Start Nginx & Certbot on Port 80
            docker compose up -d nginx certbot

            echo "Waiting for Nginx to boot..."
            sleep 5

            # Issue multi-domain certificate
            echo "Requesting Let's Encrypt SSL certificate..."
            docker compose exec certbot certbot certonly --webroot \
              -w /var/www/certbot \
              -d glatar.org -d www.glatar.org -d gbif.glatar.org \
              --email ${CERT_EMAIL} --agree-tos --non-interactive

            # Restore production HTTPS Nginx config
            echo "Restoring production HTTPS Nginx config..."
            mv nginx.conf.bak nginx.conf
          fi

          # add down 
          docker compose down
          
          docker compose up -d --scale shiny=3 --remove-orphans

          # 6. Reload Nginx to apply any configuration updates or new certs
          docker compose exec nginx nginx -s reload || true

          docker image prune -f

          docker compose ps

          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
